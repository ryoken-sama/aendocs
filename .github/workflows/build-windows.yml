name: Build Windows and Linux installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: npm ci

      - name: Set version from tag
        shell: bash
        # Strips the leading "v" from a tag like "v0.2.2" and writes it into
        # tauri.conf.json's version field, so the built installer/package is
        # named with the actual release version instead of whatever was last
        # committed there.
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          jq --arg version "$VERSION" '.version = $version' src-tauri/tauri.conf.json > tauri.conf.json.tmp
          mv tauri.conf.json.tmp src-tauri/tauri.conf.json

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Required for the auto-updater: signs the NSIS installer and,
          # because tauri.conf.json sets bundle.createUpdaterArtifacts,
          # tauri-action generates the .sig files and a latest.json update
          # manifest and attaches them to the release automatically — no
          # separate signing/upload step needed. Add TAURI_SIGNING_PRIVATE_KEY
          # (the full contents of the private key file) as a repo secret; add
          # TAURI_SIGNING_PRIVATE_KEY_PASSWORD too if the key was generated
          # with a password.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "AEN Docs ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          # We only ever build the nsis target on Windows (see
          # tauri.conf.json bundle.targets), so make that explicit rather
          # than leaving tauri-action to infer which Windows artifact
          # latest.json should point at.
          updaterJsonPreferNsis: true

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Tauri's Linux bundlers (.deb via dpkg-deb, .AppImage via
      # linuxdeploy) and the webview itself need these system libraries —
      # none of this ships with the ubuntu-latest runner by default.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Set version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          jq --arg version "$VERSION" '.version = $version' src-tauri/tauri.conf.json > tauri.conf.json.tmp
          mv tauri.conf.json.tmp src-tauri/tauri.conf.json

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Same updater signing as the Windows job (see the comment
          # there) — bundle.targets includes "deb" and "appimage" in
          # tauri.conf.json, and the bundler only builds whichever of its
          # configured targets are actually buildable on the current host,
          # so this job produces just the .deb and .AppImage.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "AEN Docs ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
